name: TsubakiReader debug APK
on:
  pull_request:
    branches: [main, 'dev/tsubaki-reader-v0.1']
  workflow_dispatch:
concurrency:
  group: tsubaki-reader-debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch native dependencies
        run: |
          git submodule update --init --depth 1 app/src/main/cpp/libjxl
          git -C app/src/main/cpp/libjxl submodule update --init --depth 1 third_party/highway third_party/brotli third_party/skcms
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android toolchain
        run: |
          sdkmanager --version
          sdkmanager --list --channel=3 > "$RUNNER_TEMP/sdk-packages.txt"
          grep -E 'platforms;android-(37|CinnamonBun)|ndk;28.2.13676358|cmake;3.31.6' "$RUNNER_TEMP/sdk-packages.txt" || true
          sdkmanager --install --channel=3 'platforms;android-37.0' 'ndk;28.2.13676358' 'cmake;3.31.6'
      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testGithubDebugUnitTest --no-daemon --stacktrace
      - name: Upload unit test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: TsubakiReader-test-reports
          path: |
            app/build/test-results/testGithubDebugUnitTest/
            app/build/reports/tests/testGithubDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
      - name: Build debug APK
        run: ./gradlew :app:assembleGithubDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TsubakiReader-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
